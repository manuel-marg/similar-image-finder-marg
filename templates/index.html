<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Calidad Visual - MARG</title>
    <style>
        :root {
            --bg: #0f1117;
            --surface: #1a1d27;
            --surface2: #242836;
            --border: #2e3348;
            --primary: #6c5ce7;
            --primary-hover: #7c6ff7;
            --success: #00b894;
            --danger: #e17055;
            --warning: #fdcb6e;
            --text: #e4e6f0;
            --text-dim: #8b8fa3;
            --radius: 10px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

        .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 32px; display: flex; align-items: center; gap: 16px; }
        .header h1 { font-size: 1.3rem; font-weight: 600; }
        .header .badge { background: var(--primary); color: #fff; font-size: 0.7rem; padding: 3px 8px; border-radius: 20px; font-weight: 600; }

        .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 24px 32px; max-width: 1600px; margin: 0 auto; }
        @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

        .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
        .panel-title { font-size: 1rem; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .panel-title .icon { font-size: 1.2rem; }

        .form-row { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
        input[type="text"], input[type="url"], input[type="number"], input[type="file"] {
            background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 9px 12px;
            border-radius: 6px; font-size: 0.85rem; outline: none; transition: border-color 0.2s;
        }
        input:focus { border-color: var(--primary); }
        input[type="text"] { flex: 1; min-width: 180px; }
        input[type="url"] { flex: 1; min-width: 200px; }
        input[type="file"] { flex: 1; }

        .btn {
            padding: 9px 18px; border: none; border-radius: 6px; font-size: 0.85rem; font-weight: 600;
            cursor: pointer; transition: all 0.15s; display: inline-flex; align-items: center; gap: 6px;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-success { background: var(--success); color: #fff; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-sm { padding: 5px 12px; font-size: 0.78rem; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .album-list { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; max-height: 420px; overflow-y: auto; }
        .album-card {
            background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 14px;
            transition: border-color 0.2s;
        }
        .album-card:hover { border-color: var(--primary); }
        .album-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .album-card-name { font-weight: 600; font-size: 0.95rem; }
        .album-card-meta { font-size: 0.78rem; color: var(--text-dim); margin-bottom: 8px; }
        .album-card-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
        .webhook-input { width: 100%; margin-top: 8px; }

        .image-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; margin-top: 10px; }
        .image-thumb {
            position: relative; aspect-ratio: 1; border-radius: 6px; overflow: hidden; border: 1px solid var(--border);
            cursor: pointer; transition: border-color 0.2s;
        }
        .image-thumb:hover { border-color: var(--danger); }
        .image-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .image-thumb .delete-x {
            position: absolute; top: 2px; right: 2px; background: var(--danger); color: #fff;
            width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-size: 11px; opacity: 0; transition: opacity 0.15s;
        }
        .image-thumb:hover .delete-x { opacity: 1; }

        .classify-zone {
            border: 2px dashed var(--border); border-radius: var(--radius); padding: 40px 20px;
            text-align: center; transition: all 0.2s; cursor: pointer; position: relative;
        }
        .classify-zone.dragover { border-color: var(--primary); background: rgba(108,92,231,0.08); }
        .classify-zone p { color: var(--text-dim); font-size: 0.9rem; margin-top: 8px; }
        .classify-zone input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

        .preview-img { max-width: 100%; max-height: 260px; border-radius: 8px; margin: 16px 0; display: none; }

        .results-area { margin-top: 16px; }
        .result-row {
            display: flex; align-items: center; gap: 12px; padding: 10px 14px;
            background: var(--surface2); border-radius: 8px; margin-bottom: 8px;
            border-left: 4px solid var(--border);
        }
        .result-row.matched { border-left-color: var(--success); }
        .result-row.not-matched { border-left-color: var(--danger); }
        .result-album { font-weight: 600; flex: 1; }
        .result-similarity { font-size: 0.85rem; font-weight: 700; min-width: 70px; text-align: right; }
        .result-badge {
            font-size: 0.7rem; padding: 3px 8px; border-radius: 12px; font-weight: 600;
        }
        .badge-pass { background: rgba(0,184,148,0.15); color: var(--success); }
        .badge-fail { background: rgba(225,112,85,0.15); color: var(--danger); }
        .badge-webhook { background: rgba(108,92,231,0.15); color: var(--primary); font-size: 0.65rem; }

        .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .toast {
            position: fixed; bottom: 24px; right: 24px; background: var(--surface); border: 1px solid var(--border);
            padding: 12px 20px; border-radius: 8px; font-size: 0.85rem; z-index: 999; opacity: 0;
            transform: translateY(10px); transition: all 0.3s; pointer-events: none;
        }
        .toast.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
        .toast.error { border-color: var(--danger); }
        .toast.success { border-color: var(--success); }

        .settings-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .settings-row label { font-size: 0.85rem; color: var(--text-dim); min-width: 160px; }
        .settings-row input[type="number"] { width: 100px; }

        .empty-state { text-align: center; padding: 30px; color: var(--text-dim); font-size: 0.85rem; }
    </style>
</head>
<body>

<div class="header">
    <h1>Control de Calidad Visual</h1>
    <span class="badge">MARG</span>
</div>

<div class="layout">
    <!-- LEFT: Album Management -->
    <div style="display:flex;flex-direction:column;gap:20px;">
        <div class="panel">
            <div class="panel-title"><span class="icon">📁</span> Crear Album</div>
            <div class="form-row">
                <input type="text" id="albumName" placeholder="Nombre del album (ej: defecto_rebaba)">
            </div>
            <div class="form-row">
                <input type="url" id="albumWebhook" placeholder="URL del Webhook (opcional)">
            </div>
            <div class="form-row">
                <button class="btn btn-primary" onclick="createAlbum()">Crear Album</button>
            </div>
        </div>

        <div class="panel">
            <div class="panel-title"><span class="icon">⚙️</span> Configuracion</div>
            <div class="settings-row">
                <label>Umbral de confianza (%):</label>
                <input type="number" id="thresholdInput" min="0" max="100" step="1" value="85">
                <button class="btn btn-primary btn-sm" onclick="saveSettings()">Guardar</button>
            </div>
            <div class="settings-row">
                <label>Modelo: MobileNetV2</label>
            </div>
        </div>

        <div class="panel">
            <div class="panel-title"><span class="icon">📂</span> Albums</div>
            <button class="btn btn-sm btn-primary" onclick="loadAlbums()" style="margin-bottom:10px;">Recargar</button>
            <div id="albumList" class="album-list">
                <div class="empty-state">Cargando albums...</div>
            </div>
        </div>
    </div>

    <!-- RIGHT: Classification & Album Detail -->
    <div style="display:flex;flex-direction:column;gap:20px;">
        <div class="panel">
            <div class="panel-title"><span class="icon">🔍</span> Clasificar Imagen</div>
            <div class="classify-zone" id="classifyZone">
                <input type="file" id="classifyFile" accept="image/*" onchange="previewAndClassify(this)">
                <strong>Arrastra o selecciona una imagen</strong>
                <p>La imagen se comparara contra todos los albums</p>
            </div>
            <img id="classifyPreview" class="preview-img" alt="preview">
            <div id="classifyLoading" style="display:none;text-align:center;padding:16px;">
                <div class="spinner"></div>
                <p style="margin-top:8px;color:var(--text-dim);font-size:0.85rem;">Procesando imagen...</p>
            </div>
            <div id="classifyResults" class="results-area"></div>
        </div>

        <div class="panel" id="albumDetailPanel" style="display:none;">
            <div class="panel-title"><span class="icon">🖼️</span> <span id="albumDetailTitle">Album</span></div>
            <div class="form-row">
                <input type="file" id="refImagesInput" accept="image/*" multiple>
                <button class="btn btn-success btn-sm" onclick="uploadRefImages()">Subir</button>
            </div>
            <div id="albumImages" class="image-grid"></div>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
const API = '';

function showToast(msg, type = 'success') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show ' + type;
    setTimeout(() => t.className = 'toast', 3000);
}

async function loadSettings() {
    try {
        const r = await fetch(API + '/api/settings');
        const d = await r.json();
        document.getElementById('thresholdInput').value = d.confidence_threshold * 100;
    } catch(e) {}
}

async function saveSettings() {
    const val = parseFloat(document.getElementById('thresholdInput').value) / 100;
    if (isNaN(val) || val < 0 || val > 1) return showToast('Valor invalido', 'error');
    await fetch(API + '/api/settings', {
        method: 'PUT', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ confidence_threshold: val })
    });
    showToast('Umbral actualizado a ' + (val*100) + '%');
}

async function createAlbum() {
    const name = document.getElementById('albumName').value.trim();
    const webhook = document.getElementById('albumWebhook').value.trim();
    if (!name) return showToast('Ingresa un nombre', 'error');
    const r = await fetch(API + '/api/albums', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ name, webhook_url: webhook })
    });
    const d = await r.json();
    if (!r.ok) return showToast(d.error || 'Error', 'error');
    document.getElementById('albumName').value = '';
    document.getElementById('albumWebhook').value = '';
    showToast('Album "' + name + '" creado');
    loadAlbums();
}

let currentAlbum = null;

async function loadAlbums() {
    const r = await fetch(API + '/api/albums');
    const d = await r.json();
    const container = document.getElementById('albumList');
    if (!d.albums.length) {
        container.innerHTML = '<div class="empty-state">No hay albums creados</div>';
        return;
    }
    container.innerHTML = d.albums.map(a => `
        <div class="album-card" onclick="selectAlbum('${a.name}')">
            <div class="album-card-header">
                <span class="album-card-name">${a.display_name}</span>
                <button class="btn btn-danger btn-sm" onclick="event.stopPropagation();deleteAlbum('${a.name}')">Eliminar</button>
            </div>
            <div class="album-card-meta">${a.image_count} imagenes de referencia</div>
            <div class="album-card-actions">
                <input type="url" class="webhook-input" value="${a.webhook_url || ''}"
                    placeholder="URL Webhook..."
                    onclick="event.stopPropagation()"
                    onchange="updateWebhook('${a.name}', this.value)">
            </div>
        </div>
    `).join('');
    if (currentAlbum) selectAlbum(currentAlbum);
}

async function deleteAlbum(name) {
    if (!confirm('Eliminar album "' + name + '"?')) return;
    await fetch(API + '/api/albums/' + name, { method: 'DELETE' });
    showToast('Album eliminado');
    document.getElementById('albumDetailPanel').style.display = 'none';
    loadAlbums();
}

async function updateWebhook(name, url) {
    await fetch(API + '/api/albums/' + name + '/webhook', {
        method: 'PUT', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ webhook_url: url })
    });
    showToast('Webhook actualizado para ' + name);
}

async function selectAlbum(name) {
    currentAlbum = name;
    document.getElementById('albumDetailTitle').textContent = name;
    document.getElementById('albumDetailPanel').style.display = 'block';
    const r = await fetch(API + '/api/albums/' + name + '/images');
    const d = await r.json();
    const container = document.getElementById('albumImages');
    if (!d.images.length) {
        container.innerHTML = '<div class="empty-state" style="grid-column:1/-1;">Sin imagenes de referencia</div>';
        return;
    }
    container.innerHTML = d.images.map(img => `
        <div class="image-thumb" onclick="deleteImage('${name}','${img.name}')">
            <img src="${img.url}" alt="${img.name}">
            <div class="delete-x">X</div>
        </div>
    `).join('');
}

async function uploadRefImages() {
    const input = document.getElementById('refImagesInput');
    if (!input.files.length || !currentAlbum) return;
    const fd = new FormData();
    for (const f of input.files) fd.append('images', f);
    const r = await fetch(API + '/api/albums/' + currentAlbum + '/upload', {
        method: 'POST', body: fd
    });
    const d = await r.json();
    if (!r.ok) return showToast(d.error || 'Error', 'error');
    showToast(d.uploaded + ' imagenes subidas');
    input.value = '';
    selectAlbum(currentAlbum);
    loadAlbums();
}

async function deleteImage(album, filename) {
    if (!confirm('Eliminar imagen?')) return;
    await fetch(API + '/api/albums/' + album + '/images/' + filename, { method: 'DELETE' });
    selectAlbum(album);
    loadAlbums();
}

function previewAndClassify(input) {
    const file = input.files[0];
    if (!file) return;
    const preview = document.getElementById('classifyPreview');
    preview.src = URL.createObjectURL(file);
    preview.style.display = 'block';
    classifyImage(file);
}

const classifyZone = document.getElementById('classifyZone');
classifyZone.addEventListener('dragover', e => { e.preventDefault(); classifyZone.classList.add('dragover'); });
classifyZone.addEventListener('dragleave', () => classifyZone.classList.remove('dragover'));
classifyZone.addEventListener('drop', e => {
    e.preventDefault();
    classifyZone.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) {
        const input = document.getElementById('classifyFile');
        const dt = new DataTransfer();
        dt.items.add(file);
        input.files = dt.files;
        previewAndClassify(input);
    }
});

async function classifyImage(file) {
    const loading = document.getElementById('classifyLoading');
    const results = document.getElementById('classifyResults');
    loading.style.display = 'block';
    results.innerHTML = '';

    const fd = new FormData();
    fd.append('image', file);

    try {
        const r = await fetch(API + '/api/classify', { method: 'POST', body: fd });
        const d = await r.json();
        loading.style.display = 'none';

        if (!r.ok) {
            results.innerHTML = '<div style="color:var(--danger);font-size:0.85rem;">' + (d.error || 'Error') + '</div>';
            return;
        }

        if (!d.results.length) {
            results.innerHTML = '<div class="empty-state">No hay albums configurados</div>';
            return;
        }

        results.innerHTML = `
            <div style="font-size:0.78rem;color:var(--text-dim);margin-bottom:10px;">
                Umbral: ${d.threshold}% | Mejor coincidencia: <strong>${d.best_match ? d.best_match.display_name : 'N/A'}</strong>
            </div>
            ${d.results.map(r => `
                <div class="result-row ${r.matched ? 'matched' : 'not-matched'}">
                    <span class="result-album">${r.display_name}</span>
                    <span class="result-similarity" style="color:${r.matched ? 'var(--success)' : 'var(--danger)'}">
                        ${r.similarity_percent}%
                    </span>
                    <span class="result-badge ${r.matched ? 'badge-pass' : 'badge-fail'}">
                        ${r.matched ? 'PASS' : 'FAIL'}
                    </span>
                    ${r.webhook_fired ? '<span class="result-badge badge-webhook">WEBHOOK</span>' : ''}
                </div>
            `).join('')}
        `;
    } catch(e) {
        loading.style.display = 'none';
        results.innerHTML = '<div style="color:var(--danger);font-size:0.85rem;">Error de conexion</div>';
    }
}

loadSettings();
loadAlbums();
</script>
</body>
</html>
